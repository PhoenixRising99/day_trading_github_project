name: Paper Trading Health Watchdog

on:
  # Best-effort independent heartbeat check. GitHub native cron can be late:
  # the broker-side stop order remains the actual downside fallback.
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpaca-paper-health-watchdog
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

jobs:
  stale-monitor-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out paper monitoring state
        uses: actions/checkout@v4

      - name: Set up Python (stdlib only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check recent committed monitor heartbeat
        run: python -m daytrading.health_watchdog
