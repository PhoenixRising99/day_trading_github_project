name: Strategy Audit (Read Only)

on:
  push:
    branches:
      - "chatgpt/strategy-audit-20261116"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check the trade ledger offline
        run: python -m audit.replay --no-market --output audit_outputs/offline
      - name: Replay historical SIP bars (read-only)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m audit.replay --output audit_outputs/historical
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit_outputs/
          retention-days: 30
